
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Patient | SHMS</title>

    <link rel="stylesheet"
          href="../assets/css/patients.css">

    <script src="../assets/js/patients.js" defer></script>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <h1>SHMS</h1>
        <p>Smart Hospital Management System</p>
    </div>

    <a href="../index.php" class="back-link">
        Home
    </a>
</header>

<main class="page">

    <div class="page-heading">
        <h2>Patient Registration</h2>
        <p>
            Register a new patient and generate
            a unique patient identification number.
        </p>
    </div>

    <section class="card">

        <h3>Patient Information</h3>

        <div id="message" role="status"
             aria-live="polite"></div>

        <form id="patientForm">

            <div class="form-grid">

                <div class="field">
                    <label for="first_name">
                        First Name
                    </label>
                    <input type="text"
                           id="first_name"
                           name="first_name"
                           maxlength="100"
                           required>
                </div>

                <div class="field">
                    <label for="last_name">
                        Last Name
                    </label>
                    <input type="text"
                           id="last_name"
                           name="last_name"
                           maxlength="100"
                           required>
                </div>

                <div class="field">
                    <label for="date_of_birth">
                        Date of Birth
                    </label>
                    <input type="date"
                           id="date_of_birth"
                           name="date_of_birth"
                           required>
                </div>

                <div class="field">
                    <label for="gender">
                        Gender
                    </label>
                    <select id="gender"
                            name="gender" required>
                        <option value="">
                            Select Gender
                        </option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="phone">
                        Phone Number
                    </label>
                    <input type="tel"
                           id="phone"
                           name="phone"
                           maxlength="30">
                </div>

                <div class="field">
                    <label for="address">
                        Address
                    </label>
                    <input type="text"
                           id="address"
                           name="address">
                </div>

            </div>

            <div class="form-actions">
                <button type="reset"
                        class="btn-secondary">
                    Clear Form
                </button>

                <button type="submit"
                        id="submitBtn"
                        class="btn-primary">
                    Register Patient
                </button>
            </div>

        </form>

    </section>

    <div class="bottom-link">
        <a href="search.html">
            Search Registered Patients
        </a>
    </div>

</main>

</body>
</html>
